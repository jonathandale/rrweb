name: Publish Tarballs

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build all packages
        run: NODE_OPTIONS='--max-old-space-size=4096' yarn build:all

      - name: Pack packages
        run: |
          mkdir -p dist-tarballs
          for pkg in \
            packages/types \
            packages/record \
            packages/replay \
            packages/packer \
            packages/rrweb \
            packages/plugins/rrweb-plugin-console-record \
            packages/plugins/rrweb-plugin-console-replay; do
            (cd $pkg && npm pack --pack-destination $GITHUB_WORKSPACE/dist-tarballs)
          done

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.0-alpha.20-vite6"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --title "rrweb 2.0.0-alpha.20 (Vite 6 build)" \
            --notes "rrweb built with Vite 6 — no base64-inlined workers" \
            dist-tarballs/*.tgz
